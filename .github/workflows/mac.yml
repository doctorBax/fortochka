name: mac-build

# Сборка macOS-релиза Fortochka: universal zip + dmg, ad-hoc подпись (без
# Apple Developer), смоук-тест прямо на раннере, артефакты — в существующий
# релиз. Запуск вручную: Actions → mac-build → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (zip + dmg, universal)
        # publish never: токен нужен только шагу загрузки ниже (gh release upload)
        run: npm run dist:mac -- --publish never
        env:
          # нет Apple-сертификата — electron-builder подписывает ad-hoc,
          # Gatekeeper обходится xattr (см. README)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke test on the runner
        run: npm run smoke

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="v$(node -p "require('./package.json').version")"
          # релиза может не быть — создаём; если есть, просто льём в него
          gh release create "$VER" --title "$VER" --generate-notes 2>/dev/null || true
          gh release upload "$VER" \
            release/fortochka-mac-*.zip \
            release/fortochka-mac-*.dmg \
            release/latest-mac.yml \
            --clobber
          gh release view "$VER"
